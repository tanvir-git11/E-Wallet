<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — E-Wallet Payment Gateway</title>
  <meta name="description" content="আপনার E-Wallet Payment Gateway অ্যাকাউন্টে লগইন করুন।" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0a0f1e 0%, #0d1a2e 50%, #0a1628 100%); }
    .btn-glow { box-shadow: 0 0 20px rgba(34,197,94,0.4); }
    .btn-glow:hover { box-shadow: 0 0 35px rgba(34,197,94,0.6); transform: translateY(-2px); transition: all 0.3s; }
    .orb { border-radius:50%; filter:blur(80px); position:absolute; pointer-events:none; }
    .input-field { background: rgba(17,28,50,0.8); border: 1px solid rgba(34,197,94,0.15); color: white; transition: all 0.3s; }
    .input-field:focus { border-color: rgba(34,197,94,0.5); box-shadow: 0 0 0 3px rgba(34,197,94,0.1); outline: none; }
    .input-field::placeholder { color: #6b7280; }
  </style>
</head>
<body class="gradient-bg text-white min-h-screen flex items-center justify-center relative overflow-hidden">
  <div class="orb w-96 h-96 bg-green-500/15 top-0 -left-32"></div>
  <div class="orb w-80 h-80 bg-green-400/10 bottom-0 -right-20"></div>

  <div class="w-full max-w-md mx-auto px-4 relative z-10">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-3">
        <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-green-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-green-500/30">💳</div>
        <div class="text-left">
          <div class="text-white font-bold text-xl leading-tight">E-Wallet</div>
          <div class="text-green-400 text-xs font-medium">Payment Gateway</div>
        </div>
      </a>
    </div>

    <!-- Card -->
    <div class="bg-[#111c32]/80 border border-green-500/15 rounded-3xl p-8 backdrop-blur-sm shadow-2xl shadow-black/40">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-white mb-2">Welcome back 👋</h1>
        <p class="text-gray-400">Log in to your account</p>
      </div>

      <form onsubmit="return false;" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">ইমেইল বা ফোন নাম্বার</label>
          <input type="text" placeholder="আপনার ইমেইল বা ফোন নাম্বার লিখুন" class="input-field w-full px-4 py-3.5 rounded-xl text-sm" />
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-medium text-gray-300">পাসওয়ার্ড</label>
            <a href="forgot-password.html" class="text-green-400 text-xs hover:text-green-300 transition-colors">Forgot password?</a>
          </div>
          <div class="relative">
            <input type="password" id="pwd" placeholder="আপনার পাসওয়ার্ড লিখুন" class="input-field w-full px-4 py-3.5 rounded-xl text-sm pr-12" />
            <button type="button" onclick="togglePwd('pwd','eye1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-green-400 transition-colors">
              <svg id="eye1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full py-4 bg-gradient-to-r from-green-500 to-green-600 text-white font-bold text-lg rounded-xl btn-glow hover:from-green-400 hover:to-green-500 transition-all mt-2">
          লগইন করুন
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-500 text-sm">অ্যাকাউন্ট নেই? <a href="register.html" class="text-green-400 hover:text-green-300 font-medium transition-colors">Register</a></p>
      </div>
    </div>

    <div class="text-center mt-6">
      <a href="index.html" class="text-gray-600 hover:text-gray-400 text-sm transition-colors flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        হোমে ফিরে যান
      </a>
    </div>
  </div>

  <script>
    function togglePwd(id, eyeId) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
