<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — E-Wallet Payment Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0a0f1e 0%, #0d1a2e 50%, #0a1628 100%); }
    .btn-glow { box-shadow: 0 0 20px rgba(34,197,94,0.4); }
    .btn-glow:hover { box-shadow: 0 0 35px rgba(34,197,94,0.6); transform: translateY(-2px); transition: all 0.3s; }
    .orb { border-radius:50%; filter:blur(80px); position:absolute; pointer-events:none; }
    .input-field { background: rgba(17,28,50,0.8); border: 1px solid rgba(34,197,94,0.15); color: white; transition: all 0.3s; }
    .input-field:focus { border-color: rgba(34,197,94,0.5); box-shadow: 0 0 0 3px rgba(34,197,94,0.1); outline: none; }
    .input-field::placeholder { color: #6b7280; }
  </style>
</head>
<body class="gradient-bg text-white min-h-screen flex items-center justify-center relative overflow-hidden">
  <div class="orb w-96 h-96 bg-green-500/15 top-0 -left-32"></div>
  <div class="orb w-80 h-80 bg-green-400/10 bottom-0 -right-20"></div>

  <div class="w-full max-w-md mx-auto px-4 relative z-10">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-3">
        <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-green-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-green-500/30">💳</div>
        <div class="text-left"><div class="text-white font-bold text-xl leading-tight">E-Wallet</div><div class="text-green-400 text-xs font-medium">Payment Gateway</div></div>
      </a>
    </div>

    <div class="bg-[#111c32]/80 border border-green-500/15 rounded-3xl p-8 backdrop-blur-sm shadow-2xl shadow-black/40">
      <div class="text-center mb-8">
        <div class="text-4xl mb-4">🔑</div>
        <h1 class="text-3xl font-extrabold text-white mb-2">পাসওয়ার্ড ভুলে গেছেন?</h1>
        <p class="text-gray-400 text-sm">আপনার রেজিস্টার্ড ইমেইল বা ফোন নাম্বার দিন। আমরা পাসওয়ার্ড রিসেট লিংক পাঠাব।</p>
      </div>
      <form onsubmit="return false;" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">ইমেইল বা ফোন নাম্বার</label>
          <input type="text" placeholder="আপনার ইমেইল বা ফোন নাম্বার লিখুন" class="input-field w-full px-4 py-3.5 rounded-xl text-sm" />
        </div>
        <button type="submit" class="w-full py-4 bg-gradient-to-r from-green-500 to-green-600 text-white font-bold text-lg rounded-xl btn-glow hover:from-green-400 hover:to-green-500 transition-all">
          রিসেট লিংক পাঠান
        </button>
      </form>
      <div class="mt-6 text-center">
        <a href="login.html" class="text-green-400 hover:text-green-300 text-sm font-medium transition-colors flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          লগইন পেজে ফিরে যান
        </a>
      </div>
    </div>
  </div>
</body>
</html>
