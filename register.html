<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — E-Wallet Payment Gateway</title>
  <meta name="description" content="নতুন এজেন্ট হিসেবে E-Wallet Payment Gateway-এ যোগ দিন।" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Hind Siliguri', 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0a0f1e 0%, #0d1a2e 50%, #0a1628 100%); }
    .btn-glow { box-shadow: 0 0 20px rgba(34,197,94,0.4); }
    .btn-glow:hover { box-shadow: 0 0 35px rgba(34,197,94,0.6); transform: translateY(-2px); transition: all 0.3s; }
    .orb { border-radius:50%; filter:blur(80px); position:absolute; pointer-events:none; }
    .input-field { background: rgba(17,28,50,0.8); border: 1px solid rgba(34,197,94,0.15); color: white; transition: all 0.3s; }
    .input-field:focus { border-color: rgba(34,197,94,0.5); box-shadow: 0 0 0 3px rgba(34,197,94,0.1); outline: none; }
    .input-field::placeholder { color: #6b7280; }
    select.input-field option { background: #111c32; color: white; }
  </style>
</head>
<body class="gradient-bg text-white min-h-screen flex items-center justify-center relative overflow-hidden py-10">
  <div class="orb w-96 h-96 bg-green-500/15 top-10 -right-32"></div>
  <div class="orb w-80 h-80 bg-green-400/10 bottom-10 -left-20"></div>

  <div class="w-full max-w-lg mx-auto px-4 relative z-10">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-3">
        <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-green-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-green-500/30">💳</div>
        <div class="text-left">
          <div class="text-white font-bold text-xl leading-tight">E-Wallet</div>
          <div class="text-green-400 text-xs font-medium">Payment Gateway</div>
        </div>
      </a>
    </div>

    <!-- Card -->
    <div class="bg-[#111c32]/80 border border-green-500/15 rounded-3xl p-8 backdrop-blur-sm shadow-2xl shadow-black/40">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-white mb-2">Create Account</h1>
        <p class="text-gray-400">Register your secure wallet profile</p>
      </div>

      <form onsubmit="return false;" class="space-y-5">
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">পুরো নাম *</label>
            <input type="text" placeholder="আপনার পুরো নাম" class="input-field w-full px-4 py-3.5 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">ফোন নাম্বার *</label>
            <input type="tel" placeholder="01XXXXXXXXX" class="input-field w-full px-4 py-3.5 rounded-xl text-sm" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">ইমেইল *</label>
          <input type="email" placeholder="your@email.com" class="input-field w-full px-4 py-3.5 rounded-xl text-sm" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Referral Code (ঐচ্ছিক)</label>
          <input type="text" placeholder="Referral code (যদি থাকে)" class="input-field w-full px-4 py-3.5 rounded-xl text-sm" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">পাসওয়ার্ড *</label>
          <div class="relative">
            <input type="password" id="pwd1" placeholder="শক্তিশালী পাসওয়ার্ড তৈরি করুন" class="input-field w-full px-4 py-3.5 rounded-xl text-sm pr-12" />
            <button type="button" onclick="togglePwd('pwd1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-green-400 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">পাসওয়ার্ড নিশ্চিত করুন *</label>
          <div class="relative">
            <input type="password" id="pwd2" placeholder="পাসওয়ার্ড পুনরায় লিখুন" class="input-field w-full px-4 py-3.5 rounded-xl text-sm pr-12" />
            <button type="button" onclick="togglePwd('pwd2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-green-400 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <!-- Terms Agreement -->
        <div class="flex items-start gap-3 p-4 bg-green-500/5 border border-green-500/15 rounded-xl">
          <input type="checkbox" id="terms" class="mt-1 w-4 h-4 accent-green-500 cursor-pointer flex-shrink-0" />
          <label for="terms" class="text-gray-400 text-sm cursor-pointer leading-relaxed">
            By registering, you agree to our <a href="terms.html" class="text-green-400 hover:text-green-300 underline underline-offset-2">terms</a> and <a href="privacy.html" class="text-green-400 hover:text-green-300 underline underline-offset-2">KYC policy</a>.
          </label>
        </div>

        <button type="submit" class="w-full py-4 bg-gradient-to-r from-green-500 to-green-600 text-white font-bold text-lg rounded-xl btn-glow hover:from-green-400 hover:to-green-500 transition-all">
          রেজিস্ট্রেশন করুন 🚀
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-500 text-sm">ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="login.html" class="text-green-400 hover:text-green-300 font-medium transition-colors">Login</a></p>
      </div>
    </div>

    <div class="text-center mt-6">
      <a href="index.html" class="text-gray-600 hover:text-gray-400 text-sm transition-colors flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        হোমে ফিরে যান
      </a>
    </div>
  </div>

  <script>
    function togglePwd(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
